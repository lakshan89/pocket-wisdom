sonar.organization=lakshan89
sonar.projectKey=lakshan89_pocket-wisdom

# Code to analyse, and where the tests live
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Specs are tests, not sources (otherwise "indexed twice").
# Migrations are generated, and seed-data is data.
sonar.exclusions=**/*.spec.ts,src/database/migrations/**,src/database/seed/seed-data.ts

# Coverage written by npm run test:cov
sonar.javascript.lcov.reportPaths=coverage/lcov.info
